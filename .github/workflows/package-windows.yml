name: Windows portable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Resell-Note | Out-Null
          Copy-Item index.html, START_HERE.bat, はじめに.txt, 使い方ガイド.txt -Destination dist/Resell-Note
          $zipPath = 'dist/Resell-Note-Windows-Portable.zip'
          Compress-Archive -Path dist/Resell-Note -DestinationPath $zipPath -Force
          Get-FileHash $zipPath -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $zipPath -Leaf)" } | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Create GitHub Release with ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = [int]"${{ github.run_number }}"
          $buildLabel = $build.ToString("D6")
          $tag = "v1.0.1-build.r$buildLabel"
          $notes = "最新のWindows向けオフライン版です。ZIPを展開して START_HERE.bat をダブルクリックしてください。商品データは利用するブラウザー内に保存され、GitHubを含むインターネットへ送信されません。`nSHA-256確認（PowerShell）: Get-FileHash .\Resell-Note-Windows-Portable.zip -Algorithm SHA256 を実行し、SHA256SUMS.txt の値と一致することを確認してください。"
          gh release create $tag dist/Resell-Note-Windows-Portable.zip dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Resell-Note v1.0.1 build.$build" `
            --latest `
            --notes $notes
