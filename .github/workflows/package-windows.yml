name: Windows portable package
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Resell-Note | Out-Null
          Copy-Item index.html, START_HERE.bat, はじめに.txt, 使い方ガイド.txt -Destination dist/Resell-Note
          Compress-Archive -Path dist/Resell-Note -DestinationPath dist/Resell-Note-Windows-Portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Resell-Note-Windows-Portable
          path: dist/Resell-Note-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 90
