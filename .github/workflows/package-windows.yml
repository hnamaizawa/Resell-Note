name: Windows portable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Resell-Note | Out-Null
          Copy-Item index.html, START_HERE.bat, はじめに.txt, 使い方ガイド.txt -Destination dist/Resell-Note
          Compress-Archive -Path dist/Resell-Note -DestinationPath dist/Resell-Note-Windows-Portable.zip -Force

      - name: Create GitHub Release with ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0-build.${{ github.run_number }}"
          gh release create $tag dist/Resell-Note-Windows-Portable.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Resell-Note v1.0.0 build.${{ github.run_number }}" `
            --notes "Windows向けオフライン版です。ZIPを展開して START_HERE.bat をダブルクリックしてください。商品データは利用するブラウザー内に保存され、GitHubを含むインターネットへ送信されません。"
